version: 3
label: v3
asOf: 4 Nov 2026
summary: An on-demand Unsloth Studio pilot, with separate storage, explicit GPU checks and no production model changes.
title: Home AI lab
description: A measured Unsloth Studio experiment beside the existing local AI platform, with verified installation status, resource boundaries and a test plan before fine-tuning.
eyebrow: home ai lab
heading:
  - "One GPU, with "
  - room to experiment
  - .
lead: >-
  Unsloth Studio adds a place to inspect datasets and try model experiments on the same workstation.
  It is an occasional tool, launched separately from the assistant. This version records the pilot,
  the checks that protect the existing workloads, and what still needs evidence before any trained
  model earns a production role.
