lead: "A local-first AI platform on a single consumer workstation: model serving, voice, retrieval
  memory, image generation, automation, and a supervised personal agent. It runs every day and does
  real work, it replaces most of a paid AI subscription stack, and it is where platform lessons get
  learned cheaply before they turn up in enterprise work."
