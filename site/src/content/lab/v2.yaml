diagram:
  label: architecture
  heading: How the pieces connect, now with a team.
  intro: >-
    The top two lanes are the v1 platform, updated. The bottom lane is new: an agent team beside the
    assistant, joined to it only by an optional task hand-off. Boxes marked local run on the lab's
    own GPU; the others run on vendor subscriptions. Teal arrows are the review flow. Dashed arrows
    and dashed boxes are optional, advisory or not yet in use.
  alt: >-
    Architecture diagram of the v2 lab in three lanes. Top lane, the personal assistant, which runs
    locally: WhatsApp, through the Hermes assistant, and a desktop microphone send chat, voice and
    photos to the personal agent, which transcribes WhatsApp voice notes on the CPU, builds a short
    daily brief in code and accepts a reconnect command;
    Home Assistant passes camera person events to it; it queries a Qdrant store fed from an Obsidian
    vault, triggers n8n automations, and sends alert pushes to the phone, which can reply with a
    snooze. Middle lane, local inference on one 12 GB GPU: a single llama-swap endpoint serves the
    resident Qwen3.5-9B with a 32k context, which handles chat, voice, retrieval answers and
    security-alert vision, plus the resident embedding model; the GPT-OSS-20B coder, which the local
    agents also use, and the Qwen3-VL-8B model load on demand, one heavy model at a time;
    Qwen3-Coder-30B and the Qwen3.5-4B are kept as fallbacks. Bottom lane, the Paperclip
    agent team, two agents local and six in the cloud: the board gives a goal to the CEO agent, who
    hands subtasks to Research, Customer Support, Engineering, Marketing, Growth and Metrics, QA and
    Security and Ops. Research and Customer Support run on the local model. Five agents, the CEO,
    Engineering, Marketing, Growth and Metrics and QA, run on Claude subscriptions, and Security
    and Ops runs on a Codex subscription. A dashed box shows a store data collector, made of fixed
    scripts that give a local agent named tools and no shell, which Growth and Metrics and Security
    and Ops are set up to use when they move to the local GPU next. A Graphify knowledge graph
    orients the Claude and Codex agents. A dashed optional link lets the personal agent create and
    check tasks in the Paperclip control plane. A review flow strip reads: Engineering pushes a
    paperclip branch, QA reviews it as a separate agent, the board approves, and the CEO merges the
    approved commit only when the board says so. The board reaches the team dashboard from a phone
    through Tailscale, on a private network with no public port.
sections:
  - label: the constraint
    heading: The hardware is still the design brief.
    intro: >-
      Unchanged from v1. Everything on this page runs on one workstation, with no second GPU and no
      rented instance. The ceiling is why the model choices below had to be measured.
    blocks:
      - type: facts
        items:
          - k: workstation
            v: Intel i7-13700KF, Windows 11 Pro
          - k: gpu
            v: NVIDIA RTX 4070, 12 GB VRAM
          - k: memory
            v: 64 GB system RAM
          - k: exposure
            v: Localhost by default. The team dashboard reaches a phone only over a private tailnet, with no public port
  - label: what changed
    heading: What changed since v1.
    intro: >-
      Eleven changes, each checked against the running config, the repository's main branch or a
      measured result. The agent team gets its own sections below.
    blocks:
      - type: numbered
        items:
          - h: The 9B is the resident model, and the 4B is a rollback
            p: >-
              Qwen3.5-9B became the resident chat and voice model on 18 July 2026, after the 4B
              invented details in a voice reply. The resident group is now the 9B plus the embedding
              model, preloaded at startup. The 4B is kept defined as a rollback, so v1's "4B router"
              line no longer holds.
          - h: The resident 9B now has a 32k context
            p: >-
              It was raised from 16k to 32k on 25 September 2026. The server's slots share one
              context pool and the assistant's fixed prompt is about 9.8k tokens, so two cached
              prompts from other callers were enough to make a WhatsApp message fail with a
              context-exceeded error.
          - h: The coder is now GPT-OSS-20B
            p: >-
              On 25 September 2026 GPT-OSS-20B replaced Qwen3-Coder-30B-A3B as the on-demand coder.
              It passed all 7 agent tasks against 4 for the old coder, which agreed to merge into
              main and to delete model files. It also reaches its first token sooner on a 5.5k-token
              prompt, at about 8 seconds against about 18, but generates more slowly, at about 27
              tokens a second against 35. Qwen3-Coder-30B-A3B stays defined as a fallback until the
              new model has a clean week.
          - h: Security alerts run on the resident model
            p: >-
              The 9B now reads security-alert frames too, so an alert never waits on a cold model
              load. It was chosen on a 25-frame head-to-head against the dedicated vision model: it
              matched every decision, invented no details, and took a median of about 2.1 seconds
              per new frame for about 1.2 GB more resident VRAM. That is a small sample with few
              person frames, so read it as a decision, not a guarantee. Photo and screen reading for
              the assistant still uses Qwen3-VL-8B.
          - h: Alerts are structured and quieter
            p: >-
              The vision model now answers in a fixed schema, description first, and push priority
              follows the scene: a person at night is urgent, vehicle-only frames arrive silently,
              and parked cars are not pushed. Notifications carry snooze buttons for 30 minutes or
              2 hours, the system raises a warning when it cannot read its own state, and a stalled
              video stream now restarts in about 6 seconds instead of about 36.
          - h: A codebase graph for the coding agents
            p: >-
              Graphify builds a knowledge graph of the repository and is wired into Claude Code and
              Codex so they orient before reading source. Retrieval tests hit 73 percent overall
              and 62 percent on held-out questions. Whether the graph makes the agents better has
              not been tested yet, so it is a tool under evaluation, not a claim.
          - h: The assistant can hand work to the team
            p: >-
              The personal agent can create and check tasks in the agent team's control plane. If
              the control plane is not running, it says so and carries on. The health check treats
              the team as optional: not running is fine, running but unhealthy is a failure.
          - h: The team dashboard reaches a phone, privately
            p: >-
              The board can open the Paperclip dashboard from a phone over Tailscale. It is
              reachable on a private tailnet only, with no public port and nothing exposed to the
              internet.
          - h: WhatsApp voice notes are transcribed on the CPU
            p: >-
              The speech model that turns WhatsApp voice notes into text used to load onto the GPU
              at the first note and hold about 1.5 GB of VRAM until the adapter restarted, most of
              the heavy model's headroom. Since 25 September it runs on the CPU: about 6.6 seconds
              to load once, then a 9-second note took 11 seconds, with VRAM unchanged. Real-time
              desktop voice still uses the GPU.
          - h: A shorter morning brief, and a reconnect command
            p: >-
              The daily WhatsApp brief is now built line by line in code, most actionable first, and
              a source that fails is left out rather than reported as empty. The local model writes
              one thing, a short phrase about overnight security events. Google sign-in expires
              about weekly, so the health check now alerts on an expired one, and replying
              "reconnect" on WhatsApp reopens it. Both changes are merged and covered by tests; the
              brief and the command have not been observed in daily use.
          - h: The weekly numbers come from scripts, not the model
            p: >-
              A 20B model should not do currency arithmetic or run scans. A store data collector and
              a security check run first as fixed scripts, and the local model only writes the report
              from their output. Its only actions are a short list of named tools, with no shell.
              This is merged and tested, but the two agents that use it, Growth & Metrics and
              Security / Ops, have not been switched to it yet and still run in the cloud.
  - label: measured
    heading: Five candidates, seven tasks, three reps each.
    intro: >-
      On 25 September 2026 the lab re-ran its model choices against behaviour-graded agent tasks
      rather than benchmark headlines. Scores are tasks passed out of seven.
    blocks:
      - type: table
        columns:
          - head: model
            style: primary-mono
          - head: role today
            style: secondary
          - head: score
            style: body-mono
          - head: decision
            style: secondary
        rows:
          - [Qwen3.5-9B, "Resident chat, voice and alert vision", 6/7, Keep]
          - [Qwen3.5-4B, "Rollback only", 5/7, "Stays a rollback"]
          - [Qwen3-Coder-30B-A3B, "Coder fallback", 4/7, "Replaced by GPT-OSS-20B"]
          - [Qwen3.6-35B-A3B, "On disk, served by nothing", 5/7, "Not adopted"]
          - [GPT-OSS-20B, "On-demand coder", 7/7, "Adopted as the coder"]
      - type: cards
        title: Two findings that changed the plan
        items:
          - label: Real headroom is about 2.8 GB
            text: >-
              The two resident models plus the Windows desktop already hold about 9.4 GB of the
              12 GB, so a heavy model has roughly 2.8 GB of true headroom, not 12. A speech model
              loaded on the GPU for WhatsApp voice notes could hold about 1.5 GB more until a
              restart, which is why those notes now run on the CPU.
          - label: Windows pages VRAM to RAM silently
            text: >-
              When VRAM is overcommitted the driver spills into system memory without an error. A
              heavy model that should have answered at about 35 tokens a second ran at 6.
      - type: callout
        label: measured, decided, applied
        text: >-
          GPT-OSS-20B scored best and is now the served coder. A re-run through the live model
          server, one repetition, passed 7 of 7 tasks at about 29 tokens a second. Qwen3-Coder-30B-A3B
          stays defined as a fallback. Qwen3.6-35B-A3B is on disk and serves nothing. Nothing counts
          as running until the config says so.
  - label: the team
    heading: Eight agents, one control plane, no self-approval.
    intro: >-
      The team runs on Paperclip, a self-hosted control plane that sits beside the personal
      assistant, not in front of it: stopping it changes nothing for the assistant. Each agent has
      one job and one concurrent run, and wakes on an assignment or a mention, not on a heartbeat
      timer. The scheduled routines in the guardrails section are the one exception. The plan is for
      the local GPU to do the recurring weekly work and for the cloud to handle code and planning.
      Today two of the eight agents run locally, and the roster below is the live one.
    blocks:
      - type: table
        columns:
          - head: agent
            style: primary-mono
          - head: job
            style: secondary
          - head: runs on
            style: body-mono
        rows:
          - [CEO, "Turns a goal into two or three subtasks, sets the review gates and reports to the board.", Claude]
          - [Engineering, "Implements on paperclip/* git branches, tests first. Never merges.", Claude]
          - [QA, "Reviews Engineering's branch independently and runs the tests.", "Claude, for now"]
          - [Research, "Reads, measures and compares. Cannot edit.", Local GPU]
          - [Marketing, "Store copy, social drafts, SEO and a weekly plan. Drafts only, publishes nothing.", Claude]
          - [Growth & Metrics, "Weekly per-app downloads, revenue and reviews. Read-only. Set up to move to the local GPU next.", Claude]
          - [Security / Ops, "Weekly sweep for auth bypass, secrets, dependencies and DNS. Read-only. Set up to move to the local GPU next.", Codex]
          - [Customer Support, "Triages, drafts replies and turns bugs into tasks. Drafts only.", Local GPU]
      - type: cards
        title: Local and cloud, stated plainly
        items:
          - label: Local
            text: >-
              Every personal-assistant model call, and two agents, Research and Customer Support,
              run on the lab's own GPU through one model endpoint with no per-token cost. The two
              agents use the on-demand coder model and share the GPU with the assistant. They have
              no shell: they read the repository through read-only tools, and the worker code, not
              the model, closes each task.
          - label: Cloud
            text: >-
              The other six agents run on vendor subscription logins, by design: five on Claude,
              one on Codex. Code and planning stay there. When tested, local models answered
              correctly but did not reliably close their own tasks, and the team's 31k-token prompt
              overflowed a 16k context. Closing the task in code fixed the first problem for
              Research and Support. The resident model has since moved to a 32k context, for a
              different reason, and that has not been re-measured. Growth & Metrics and Security /
              Ops are the next two set up to move local; they are not yet, so this page counts them
              in the cloud.
          - label: Different vendors, when it can be
            text: >-
              By design, Engineering runs on Anthropic and is reviewed by QA on OpenAI, so the
              reviewer is not a copy of the author. Today QA is still on Claude: a temporary
              override has expired, but the roster has not been re-provisioned yet. Until it is,
              reviews are independent but not cross-vendor.
          - label: The hand-off is narrow
            text: >-
              The assistant can create a task and read its status. Nothing else crosses between the
              assistant and the team.
  - label: review flow
    heading: Nothing merges without a person.
    intro: >-
      The CEO attaches a two-stage gate to every Engineering subtask it creates: a review stage with
      QA, then an approval stage with the board. Engineering never approves its own work.
    blocks:
      - type: numbered
        items:
          - h: The CEO splits the goal
            p: >-
              A goal becomes two or three subtasks. Each Engineering subtask gets the review stage
              and the approval stage.
          - h: Engineering works on a branch
            p: >-
              In its own clone, on a paperclip/* branch, writing the test first. It commits, pushes
              the branch to the local checkout and hands the task to review.
          - h: QA reviews as a separate agent
            p: >-
              QA reads the change and runs the tests. If it asks for changes, the task returns to
              Engineering automatically. QA is meant to run on a different vendor from Engineering;
              today it is still on the same one, pending re-provisioning.
          - h: The board approves
            p: Only after approval can the task reach done.
          - h: The merge is the board's call
            p: >-
              Merging is never automatic. The CEO agent may merge, but only when the board tells it
              to in a comment, and only the exact commit QA approved. No other agent merges. Two
              hooks also stop any agent pushing to main directly: a client-side hook in the agent
              clone, and a server-side hook on the source checkout. Adding a new agent needs board
              approval.
      - type: callout
        label: the honest version
        text: >-
          The gate is set per Engineering subtask by the CEO, so it is a habit of the workflow,
          backed by the merge hooks, not a property of every task. Three routines, two weekly and
          one monthly, are
          switched on but have not fired yet, so no routine output is claimed on this page.
  - label: guardrails
    heading: The same safety model, sized for a team.
    intro: >-
      The personal agent's guardrails from v1 still apply to the assistant. These are the ones the
      team adds.
    blocks:
      - type: cards
        items:
          - label: One run at a time
            text: Every agent has one concurrent run and no timer wake, so nothing starts itself.
          - label: Never in the main checkout
            text: Agents work in their own clones and worktrees, on their own branches.
          - label: Spend caps
            text: >-
              Each agent has a budget cap that pauses it automatically if it runs away. The
              mechanism is real; the amounts are not published.
          - label: Scheduled routines
            text: >-
              A weekly numbers report, a weekly security sweep, and a monthly growth loop that the
              CEO runs, with one experiment per app for the board to approve. Marketing's own weekly
              plan is paused and folded into the monthly loop. They only run while the control plane
              is up.
          - label: Quota guard
            text: >-
              Budget caps only count metered spend, and the agents run on subscriptions, so a loop
              would burn quota without tripping one. A watchdog counts each subscription agent's
              runs per day, pauses one that runs more than 40 times and alerts the phone.
          - label: Overrides that expire
            text: >-
              An agent's runtime can be swapped temporarily, as with QA on Claude while a Codex
              allowance resets, with an expiry, so the next re-provisioning restores the repository's spec
              without anyone having to undo it.
          - label: Daily backups
            text: >-
              The control plane's database and settings are copied daily to two separate drives,
              keeping seven days. The secrets key is deliberately not copied.
          - label: Three stores, kept apart
            text: >-
              The control plane holds task history, the repository's core folder holds durable
              company knowledge, and the assistant's memory holds assistant memory. Nothing is
              copied between them.
  - label: left out
    heading: What v2 does not claim.
    intro: >-
      The rule for this page is that nothing is listed as running without evidence. These items
      were described in v1, or are in progress, and could not be confirmed on 25 and 26 September
      2026.
    blocks:
      - type: cards
        items:
          - label: Image generation and video
            text: >-
              ComfyUI, SDXL, Flux and the ffmpeg media pipeline are in v1 and were not re-checked
              for v2. A newer video model is installed, but no render has been run.
          - label: Ollama and the chat workspace
            text: Named in v1. There is no evidence that either is running now.
          - label: Cost figures
            text: >-
              The v1 economics table was not re-measured. It stays in v1 and is not extended to the
              agent team.
          - label: Whether the graph helps
            text: >-
              Retrieval was measured. The test of whether it improves agent quality has not been
              run.
          - label: Agent and routine results
            text: >-
              The team and its routines are set up and gated. No output from them is cited as a
              result here.
          - label: Local weekly reports
            text: >-
              Growth & Metrics and Security / Ops are set up to run locally but have not been
              switched. A proof run found the local model chasing a false positive and inventing
              percentages, so the role instructions now forbid both. No local report is cited.
          - label: The brief and reconnect in daily use
            text: >-
              The new morning brief and the reconnect command are merged and covered by tests, but
              no live run of either is cited here.
          - label: Qwen3.6
            text: Benchmarked and not adopted. It is on disk and nothing serves it.
