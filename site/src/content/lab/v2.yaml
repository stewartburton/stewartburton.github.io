# v2 of the lab page: the lab as of 26 Sep 2026 (refreshed from 25 Sep, see the PR for the fact check).
# Every claim here was checked against the running config or a measured result.
# If it could not be verified it is left out, and listed under "what v2 does not claim".
version: 2
label: v2
asOf: 26 Sep 2026
summary: Two resident models, security alerts on the local 9B, and an eight-agent team, two of them on the local GPU, behind a review gate.
title: Home AI lab
description: >-
  A local-first AI platform on one 12 GB GPU, now with a team of AI agents beside it: what changed
  since v1, the measured model refresh, which agents run locally and which in the cloud, and the
  review gate that keeps every merge a board decision.
eyebrow: home ai lab
heading:
  - "One 12 GB GPU, run like "
  - production infrastructure
  - .
lead: >-
  A local-first AI platform on a single consumer workstation, now with a small team of AI agents
  working beside it. The personal assistant, voice, retrieval, vision and home security alerts
  still run on the local GPU. The agent team does engineering, research and weekly reporting under
  written review gates. The plan is for the local GPU to do the recurring weekly work while cloud
  subscriptions handle code and planning. Today that split is partway there, and this page says
  exactly which agents run where.
