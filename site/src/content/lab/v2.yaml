diagram:
  label: architecture
  heading: How the pieces connect, now with a team.
  intro: >-
    The top two lanes are the v1 platform, updated. The bottom lane is new: an agent team beside the
    assistant, joined to it only by an optional task hand-off. Teal arrows are the review flow.
    Dashed arrows are optional or advisory.
  alt: >-
    Architecture diagram of the v2 lab in three lanes. Top lane, the personal assistant, which runs
    locally: a phone and a desktop microphone send chat, voice and photos to the personal agent;
    Home Assistant passes camera person events to it; it queries a Qdrant store fed from an Obsidian
    vault, triggers n8n automations, and sends alert pushes to the phone, which can reply with a
    snooze. Middle lane, local inference on one 12 GB GPU: a single llama-swap endpoint serves the
    resident Qwen3.5-9B, which handles chat, voice, retrieval answers and security-alert vision,
    plus the resident embedding model; the Qwen3-Coder-30B and Qwen3-VL-8B models load on demand,
    one heavy model at a time; the Qwen3.5-4B is kept as a rollback. Bottom lane, the Paperclip
    agent team, mostly cloud: the board gives a goal to the CEO agent, who hands subtasks to
    Research, Engineering, Marketing, Growth and Metrics, Customer Support, QA and Security and Ops.
    Research runs on the local model. Five agents run on Claude subscriptions and two, QA and
    Security and Ops, on Codex subscriptions. A Graphify knowledge graph orients the Claude and
    Codex agents. A dashed optional link lets the personal agent create and check tasks in the
    Paperclip control plane. A review flow strip reads: Engineering pushes a paperclip branch, QA
    reviews it on a different vendor, the board approves, and the board merges to main by hand.
sections:
  - label: the constraint
    heading: The hardware is still the design brief.
    intro: >-
      Unchanged from v1. Everything on this page runs on one workstation, with no second GPU and no
      rented instance. The ceiling is why the model choices below had to be measured.
    blocks:
      - type: facts
        items:
          - k: workstation
            v: Intel i7-13700KF, Windows 11 Pro
          - k: gpu
            v: NVIDIA RTX 4070, 12 GB VRAM
          - k: memory
            v: 64 GB system RAM
          - k: exposure
            v: Localhost by default, nothing published by accident
  - label: what changed
    heading: What changed since v1.
    intro: >-
      Five changes to the platform, each checked against the running config or a measured result.
      The agent team gets its own sections below.
    blocks:
      - type: numbered
        items:
          - h: The 9B is the resident model, and the 4B is a rollback
            p: >-
              Qwen3.5-9B became the resident chat and voice model on 18 July 2026, after the 4B
              invented details in a voice reply. The resident group is now the 9B plus the embedding
              model, preloaded at startup. The 4B is kept defined as a rollback, so v1's "4B router"
              line no longer holds.
          - h: Security alerts run on the resident model
            p: >-
              The 9B now reads security-alert frames too, so an alert never waits on a cold model
              load. It was chosen on a 25-frame head-to-head against the dedicated vision model: it
              matched every decision, invented no details, and took a median of about 2.1 seconds
              per new frame for about 1.2 GB more resident VRAM. That is a small sample with few
              person frames, so read it as a decision, not a guarantee. Photo and screen reading for
              the assistant still uses Qwen3-VL-8B.
          - h: Alerts are structured and quieter
            p: >-
              The vision model now answers in a fixed schema, description first, and push priority
              follows the scene: a person at night is urgent, vehicle-only frames arrive silently,
              and parked cars are not pushed. Notifications carry snooze buttons for 30 minutes or
              2 hours, the system raises a warning when it cannot read its own state, and a stalled
              video stream now restarts in about 6 seconds instead of about 36.
          - h: A codebase graph for the coding agents
            p: >-
              Graphify builds a knowledge graph of the repository and is wired into Claude Code and
              Codex so they orient before reading source. Retrieval tests hit 73 percent overall
              and 62 percent on held-out questions. Whether the graph makes the agents better has
              not been tested yet, so it is a tool under evaluation, not a claim.
          - h: The assistant can hand work to the team
            p: >-
              The personal agent can create and check tasks in the agent team's control plane. If
              the control plane is not running, it says so and carries on. The health check treats
              the team as optional: not running is fine, running but unhealthy is a failure.
  - label: measured
    heading: Five candidates, seven tasks, three reps each.
    intro: >-
      On 25 September 2026 the lab re-ran its model choices against behaviour-graded agent tasks
      rather than benchmark headlines. Scores are tasks passed out of seven.
    blocks:
      - type: table
        columns:
          - head: model
            style: primary-mono
          - head: role today
            style: secondary
          - head: score
            style: body-mono
          - head: decision
            style: secondary
        rows:
          - [Qwen3.5-9B, "Resident chat, voice and alert vision", 6/7, Keep]
          - [Qwen3.5-4B, "Rollback only", 5/7, "Stays a rollback"]
          - [Qwen3-Coder-30B-A3B, "On-demand coder", 4/7, "Replacement recommended"]
          - [Qwen3.6-35B-A3B, "On disk, served by nothing", 5/7, "Not adopted"]
          - [GPT-OSS-20B, "Benchmark candidate only", 7/7, "Recommended for the coder slot"]
      - type: cards
        title: Two findings that changed the plan
        items:
          - label: Real headroom is about 2.8 GB
            text: >-
              The two resident models plus the Windows desktop already hold about 9.4 GB of the
              12 GB, so a heavy model has roughly 2.8 GB of true headroom, not 12.
          - label: Windows pages VRAM to RAM silently
            text: >-
              When VRAM is overcommitted the driver spills into system memory without an error. A
              heavy model that should have answered at about 35 tokens a second ran at 6.
      - type: callout
        label: measured, decided, not yet applied
        text: >-
          GPT-OSS-20B scored best, but it is not served: the live model config is unchanged.
          Qwen3.6-35B-A3B is on disk and also serves nothing. Neither counts as running until the
          config says so.
  - label: the team
    heading: Eight agents, one control plane, no self-approval.
    intro: >-
      The team runs on Paperclip, a self-hosted control plane that sits beside the personal
      assistant, not in front of it: stopping it changes nothing for the assistant. Each agent has
      one job and one concurrent run, and wakes on an assignment or a mention, not on a timer.
    blocks:
      - type: table
        columns:
          - head: agent
            style: primary-mono
          - head: job
            style: secondary
          - head: runs on
            style: body-mono
        rows:
          - [CEO, "Turns a goal into two or three subtasks, sets the review gates and reports to the board.", Claude]
          - [Engineering, "Implements on paperclip/* git branches, tests first. Never merges.", Claude]
          - [QA, "Reviews Engineering's branch independently and runs the tests.", Codex]
          - [Research, "Reads, measures and compares. Cannot edit.", Local GPU]
          - [Marketing, "Store copy, social drafts, SEO and a weekly plan. Drafts only, publishes nothing.", Claude]
          - [Growth & Metrics, "Weekly per-app downloads, revenue and reviews. Read-only.", Claude]
          - [Security / Ops, "Weekly sweep for auth bypass, secrets, dependencies and DNS. Read-only.", Codex]
          - [Customer Support, "Triages, drafts replies and turns bugs into tasks. Drafts only.", Claude]
      - type: cards
        title: Local and cloud, stated plainly
        items:
          - label: Local
            text: >-
              Every personal-assistant model call, and the Research agent, run on the lab's own GPU
              through one model endpoint with no per-token cost. Only one agent uses the GPU, so the
              team can create at most one local inference job at a time.
          - label: Cloud
            text: >-
              The other seven agents run on vendor subscription logins, by design: five on Claude,
              two on Codex. Local models answered correctly but did not reliably close their own
              tasks and overflowed a 16k context on the team's 31k-token prompt, so Support is the
              first candidate to move local.
          - label: Different vendors on purpose
            text: >-
              Engineering runs on Anthropic and is reviewed by QA on OpenAI, so the reviewer is not
              a copy of the author.
          - label: The hand-off is narrow
            text: >-
              The assistant can create a task and read its status. Nothing else crosses between the
              assistant and the team.
  - label: review flow
    heading: Nothing merges without a person.
    intro: >-
      The CEO attaches a two-stage gate to every Engineering subtask it creates: a review stage with
      QA, then an approval stage with the board. Engineering never approves its own work.
    blocks:
      - type: numbered
        items:
          - h: The CEO splits the goal
            p: >-
              A goal becomes two or three subtasks. Each Engineering subtask gets the review stage
              and the approval stage.
          - h: Engineering works on a branch
            p: >-
              In its own clone, on a paperclip/* branch, writing the test first. It commits, pushes
              the branch to the local checkout and hands the task to review.
          - h: QA reviews from a different vendor
            p: >-
              QA reads the change and runs the tests. If it asks for changes, the task returns to
              Engineering automatically.
          - h: The board approves
            p: Only after approval can the task reach done.
          - h: The merge is manual
            p: >-
              Stewart merges to main by hand. Two layers stop the agents doing it: a client-side
              hook in the agent clone, and a server-side hook on the source checkout that refuses
              any push to main. Adding a new agent also needs board approval.
      - type: callout
        label: the honest version
        text: >-
          The gate is set per Engineering subtask by the CEO, so it is a habit of the workflow,
          backed by the merge hooks, not a property of every task. Three weekly routines are
          switched on but have not fired yet, so no routine output is claimed on this page.
  - label: guardrails
    heading: The same safety model, sized for a team.
    intro: >-
      The personal agent's guardrails from v1 still apply to the assistant. These are the ones the
      team adds.
    blocks:
      - type: cards
        items:
          - label: One run at a time
            text: Every agent has one concurrent run and no timer wake, so nothing starts itself.
          - label: Never in the main checkout
            text: Agents work in their own clones and worktrees, on their own branches.
          - label: Spend caps
            text: >-
              Each agent has a budget cap that pauses it automatically if it runs away. The
              mechanism is real; the amounts are not published.
          - label: Weekly routines
            text: >-
              A security sweep on Sundays, and a numbers report and a growth plan on Mondays. They
              only run while the control plane is up, and it is not started with the rest of the lab.
          - label: Three stores, kept apart
            text: >-
              The control plane holds task history, the repository's core folder holds durable
              company knowledge, and the assistant's memory holds assistant memory. Nothing is
              copied between them.
  - label: left out
    heading: What v2 does not claim.
    intro: >-
      The rule for this page is that nothing is listed as running without evidence. These items
      were described in v1, or are in progress, and could not be confirmed on 25 September 2026.
    blocks:
      - type: cards
        items:
          - label: Image generation and video
            text: >-
              ComfyUI, SDXL, Flux and the ffmpeg media pipeline are in v1 and were not re-checked
              for v2. A newer video model is installed, but no render has been run.
          - label: Ollama and the chat workspace
            text: Named in v1. There is no evidence that either is running now.
          - label: Cost figures
            text: >-
              The v1 economics table was not re-measured. It stays in v1 and is not extended to the
              agent team.
          - label: Whether the graph helps
            text: >-
              Retrieval was measured. The test of whether it improves agent quality has not been
              run.
          - label: Agent and routine results
            text: >-
              The team and its routines are set up and gated. No output from them is cited as a
              result here.
          - label: GPT-OSS-20B and Qwen3.6
            text: Benchmark candidates. Neither is served.
  - label: the stack
    heading: What it is built from.
    blocks:
      - type: chips
        label: stack
        items:
          - llama.cpp
          - llama-swap
          - Qwen3.5
          - Qwen3-Coder
          - Qwen3-VL
          - GGUF quantization
          - Qdrant
          - Obsidian
          - n8n
          - Home Assistant
          - ntfy
          - Paperclip
          - Claude Code
          - Codex
          - Graphify
          - WSL2
          - Python
      - type: links
        items:
          - label: v1, archived
            href: /lab/v1/
            tone: accent
          - label: enterprise and product work
            href: /work
            tone: primary
          - label: get in touch
            href: /contact
            tone: primary
